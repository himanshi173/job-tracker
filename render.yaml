services:
  - type: web
    name: job-tracker
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false # User must provide this (e.g. from MongoDB Atlas)
      - key: JSEARCH_API_KEY
        sync: false # User must provide this
      - key: GEMINI_API_KEY
        sync: false # User must provide this
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false # User must provide this
      - key: SMTP_PASSWORD
        sync: false # User must provide this

