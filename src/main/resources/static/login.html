<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Job Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card glass">
            <div class="auth-header">
                <div class="logo-container">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to manage your job applications</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
                        <span class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
                        <a href="#" id="forgotPasswordLink" style="font-size: 13px; color: var(--primary); text-decoration: none;">Forgot Password?</a>
                    </div>
                    <div class="input-wrapper" style="position: relative;">
                        <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password" style="padding-right: 42px;">
                        <span class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <span class="password-toggle-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; z-index: 10;">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-off-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </span>
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create one</a>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal Overlay -->
    <div id="forgotPasswordModalOverlay" class="modal-overlay">
        <div class="modal glass" style="max-width: 420px; width: 90%; display: flex; flex-direction: column; padding: 28px;">
            <div class="modal-header" style="flex-shrink: 0; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="display: flex; align-items: center; gap: 8px; font-size: 20px; color: var(--text-primary);">
                    Password Recovery
                </h3>
                <button id="closeForgotPasswordModalBtn" class="modal-close" style="font-size: 24px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer;">&times;</button>
            </div>
            
            <form id="forgotPasswordForm" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="form-group">
                    <label for="forgotEmail" class="form-label">Email Address</label>
                    <div class="input-wrapper" style="display: flex; gap: 8px;">
                        <input type="email" id="forgotEmail" class="form-input" placeholder="Enter your registered email" required style="flex: 1;">
                        <button type="button" id="sendResetOtpBtn" class="btn btn-secondary" style="width: auto; padding: 0 16px; font-size: 13px; height: 42px; white-space: nowrap;">Send OTP</button>
                    </div>
                </div>

                <!-- OTP & New Password Group (Hidden by default) -->
                <div id="resetFieldsGroup" class="hidden" style="display: flex; flex-direction: column; gap: 16px;">
                    <div class="form-group">
                        <label for="resetOtp" class="form-label">Verification Code (OTP)</label>
                        <input type="text" id="resetOtp" class="form-input" placeholder="Enter 6-digit code" maxlength="6">
                    </div>

                    <div class="form-group">
                        <label for="newPassword" class="form-label">New Password</label>
                        <div class="input-wrapper" style="position: relative;">
                            <input type="password" id="newPassword" class="form-input" placeholder="Enter new password" style="padding-right: 42px;">
                            <span class="password-toggle-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; z-index: 10;">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-off-icon hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="modal-footer" style="flex-shrink: 0; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--card-border); display: flex; justify-content: flex-end; gap: 8px;">
                    <button type="button" id="cancelResetBtn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" id="submitResetBtn" class="btn btn-primary" style="width: auto;" disabled>Reset Password</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
